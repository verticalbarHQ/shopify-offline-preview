name: docs-drift
# Weekly check that the vendored Shopify/theme-liquid-docs files still match upstream. A change
# fails the run; a maintainer then updates the pin and opens the pull request. Actions does not
# open pull requests in this repository.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node tools/check-docs-drift.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
